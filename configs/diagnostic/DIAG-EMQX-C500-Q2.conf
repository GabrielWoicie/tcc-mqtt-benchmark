# TCC MQTT Benchmark - diagnostico QoS
# Objetivo: verificar se mensagens nao recebidas na janela oficial permanecem em backlog/inflight.
# Alteracao em relacao ao teste oficial: apenas scenario-id e drain ampliado.

mode=message

scenario-id=DIAG-EMQX-C500-Q2
repetition=1

broker=mqtt://18.191.162.215:1883
broker-name=emqx

clients=500
connect-rate=100
out=results

username=
password=
tls-insecure=false

publish-pattern=staggered
qos=2
rate=1

warmup=10s
duration=60s
drain=420s

payload-bytes=256
topic-prefix=tcc/benchmark
