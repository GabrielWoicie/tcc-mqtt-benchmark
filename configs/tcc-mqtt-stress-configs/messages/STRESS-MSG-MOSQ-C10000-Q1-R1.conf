# TCC MQTT Benchmark - TESTE EXPLORATORIO DE ESTRESSE (NAO OFICIAL)
# mqttbench v0.3.0 - publicacao; sem TLS e sem autenticacao
# Nao incorporar aos 48 ensaios oficiais do TCC.
# Carga teorica solicitada: 10000 publicadores x 1 msg/s = 10000 msg/s.

mode=message

scenario-id=STRESS-MSG-MOSQ-C10000-Q1-R1
repetition=1

broker=mqtt://18.226.200.150:1883
broker-name=mosquitto

clients=10000
connect-rate=100
out=results

username=
password=
tls-insecure=false

publish-pattern=staggered
qos=1
rate=1

warmup=10s
duration=60s
drain=5s

payload-bytes=256
topic-prefix=tcc/benchmark
